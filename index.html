
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>ZZZMap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>ZZZMap</h1>
  <p>ゼンレスゾーンゼロ カップリング可視化</p>
</header>

<main>
  <h2>キャラクター検索</h2>

  <input id="search"
         placeholder="キャラクター名を入力">

  <select id="faction">
    <option value="">すべての陣営</option>
  </select>

  <p id="result-count"></p>
  <div id="characters"></div>

  <h2>カップリングランキング</h2>
  <p>※作品数は動作確認用の架空データです。</p>
  <div id="ranking"></div>
</main>

<script src="characters.js"></script>
<script src="script.js"></script>

</body>
</html>
